  .contenedor-horizontal-interactivo { 
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 15px;
    margin-bottom: 25px;
  }

  @media (max-width: 992px) {
    .contenedor-horizontal-interactivo {
      grid-template-columns: 1fr;
    }
  }

  .columna-interactiva-bloque {
    display: flex;
    flex-direction: column;
    gap: 10px;
    justify-content: stretch;
  }

  .transmision-split-grid {

    margin-bottom: 25px;
    overflow: hidden;
  }
</style><script>
  document.addEventListener('DOMContentLoaded', function() {
    const audioControl = document.getElementById('audio-reproductor-principal');
    const btnCambiarFuente = document.getElementById('btn-cambiar-fuente');
    const indicadorEstado = document.getElementById('streaming-status-text');
    let fuenteActual = 'promo';

    if (audioControl && btnCambiarFuente) {
      audioControl.addEventListener('ended', function() {
        if (fuenteActual === 'promo') {
          conectarRadioEnVivo();
        }
      });

      btnCambiarFuente.addEventListener('click', function() {
        if (fuenteActual === 'promo') {
          conectarRadioEnVivo();
        } else {
          conectarPromoDeBienvenida();
        }
      });
    }

    function conectarRadioEnVivo() {
      fuenteActual = 'radio';
      if (btnCambiarFuente) btnCambiarFuente.textContent = '🎵 Escuchar Promo de Bienvenida';
      if (indicadorEstado) {
        indicadorEstado.textContent = "📻 Escuchando Radio UdeG 104.3 Fm EN VIVO";
        indicadorEstado.style.color = "#10b981";
      }
      audioControl.src = "https://stream.zeno.fm/9akhcnmh6ehvv";
      audioControl.load();
      audioControl.play().catch(err => console.log('Error al conectar streaming:', err));
    }

    function conectarPromoDeBienvenida() {
      fuenteActual = 'promo';
      if (btnCambiarFuente) btnCambiarFuente.textContent = '📻 Cambiar a Radio en Vivo';
      if (indicadorEstado) {
        indicadorEstado.textContent = "🎙️ Escuchando Promo de Bienvenida...";
        indicadorEstado.style.color = "#fef3c7";
      }
      audioControl.src = "PROMO - GIRA DE CONCIERTOS PREVENTIVO 2027.mp3";
      audioControl.load();
      audioControl.play().catch(err => console.log('Error al reproducir la promo:', err));
    }
  });
